# Parlamonitor — Docker / Podman Compose deployment.
#
# One image (OPS-1), a small set of services around two shared volumes. The
# serving process is run as two interchangeable "colors" behind an in-stack
# reverse proxy so application/SPA updates swap in with ZERO downtime — see
# ./deploy.sh and DEPLOYMENT.md.
#
#   caddy      — the stable front. Owns the published port and health-check-
#                balances across app_blue / app_green. Nothing else binds the
#                port, so the color swap is invisible to whatever is in front
#                (Cloudflare, a host TLS proxy, or nothing).
#   app_blue   — the two serving colors (FastAPI: API + Vue SPA + MP photos).
#   app_green    Only ONE runs in steady state; ./deploy.sh flips between them.
#   init       — one-shot: builds the runtime DB from /data on first boot
#                (or REBUILD_DB=1), then exits. Keeps the slow first build out
#                of the serving container's healthcheck.
#   sync       — sidecar: continuously checks parlament.hu for changes in the
#                latest cycle, re-scrapes only what changed (SCR-2/SCR-4) and
#                incrementally updates the DB in place, swapping it atomically
#                (DB-4). The app picks it up on the next request — no restart.
#   app        — tools-only (never auto-starts): the target of one-off
#                `compose run --rm app <loader|update|pytest|sh|…>` commands.
#
#   ./deploy.sh                       # build current checkout + zero-downtime swap
#   podman compose logs -f app_blue   # watch the active color (whichever is up)
#   podman compose logs -f sync       # watch the continuous sync
#   open http://localhost:8000        # app + /api/docs (via caddy)
#
# See DEPLOYMENT.md for the full guide.

x-common-env: &common-env
  # Paths inside the container (match the volumes below).
  PARLAMONITOR_DB: /db/parlamonitor.db
  PARLAMONITOR_DATA_DIR: /data
  PARLAMONITOR_PHOTOS_DIR: /data/media/photos
  # Empty = all modules (proceedings,representatives,bills,votes). EXT-6.
  PARLAMONITOR_MODULES: ${PARLAMONITOR_MODULES:-}

# Word-cloud NLP config shared by the services that build/update the DB (init,
# sync). Set PARLAMONITOR_WORDCLOUD_BACKEND=modal + the Modal token to offload the
# heavy NER/lemmatization to modal.com (WCLOUD-6) — ideal on a small host.
x-nlp-env: &nlp-env
  PARLAMONITOR_WORDCLOUD_BACKEND: ${PARLAMONITOR_WORDCLOUD_BACKEND:-auto}
  PARLAMONITOR_MODAL_APP: ${PARLAMONITOR_MODAL_APP:-parlamonitor-nlp}
  MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
  MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}

# Whisper forced-alignment sentence-timing config for the scraping side (sync).
# PARLAMONITOR_TIMING_BACKEND=auto uses Whisper on Modal when the MODAL_TOKEN_* above
# is set (deploy scraper/whisper_modal_app.py first), else degrades to the positional
# estimate (TIM-1/TIM-5). Reuses the same Modal token as the word-cloud offload; only
# the deployed app name differs.
x-timing-env: &timing-env
  PARLAMONITOR_TIMING_BACKEND: ${PARLAMONITOR_TIMING_BACKEND:-auto}
  PARLAMONITOR_WHISPER_MODAL_APP: ${PARLAMONITOR_WHISPER_MODAL_APP:-parlamonitor-whisper}

# Extra env for the serving process (API + SPA + photos).
x-app-serve-env: &app-serve-env
  PARLAMONITOR_FRONTEND_DIST: /app/frontend/dist
  # Served same-origin, so CORS only matters if you point a separate SPA host
  # at this API. Set to your public origin(s), comma-separated.
  PARLAMONITOR_CORS_ORIGINS: ${PARLAMONITOR_CORS_ORIGINS:-http://localhost:8000}
  # Canonical public base URL used to build the absolute og:url / og:image in
  # the server-rendered social share cards (og.py). Set this to your real
  # public origin so a shared link previews with correct absolute URLs; behind
  # a proxy the request's own scheme/host is often wrong. When unset the cards
  # fall back to the request base URL.
  PARLAMONITOR_SITE_URL: ${PARLAMONITOR_SITE_URL:-}
  # Uvicorn worker processes (default: one per core). The API is read-only over
  # one SQLite file, so workers scale it across cores safely.
  PARLAMONITOR_WEB_WORKERS: ${PARLAMONITOR_WEB_WORKERS:-}
  # Cache-Control stamped on API / HTML responses (see backend/app/caching.py
  # and the "Handling high traffic" section of DEPLOYMENT.md).
  PARLAMONITOR_API_CACHE_CONTROL: ${PARLAMONITOR_API_CACHE_CONTROL:-}
  PARLAMONITOR_HTML_CACHE_CONTROL: ${PARLAMONITOR_HTML_CACHE_CONTROL:-}

# The serving color, shared by app_blue and app_green. They are identical except
# for their name; ./deploy.sh runs exactly one at a time. No published port —
# only caddy binds the port and proxies to whichever color is healthy.
x-app-serve: &app-serve
  build:
    context: .
    dockerfile: Dockerfile
  image: parlamonitor:latest
  environment:
    <<: [*common-env, *app-serve-env]
  volumes:
    # Scraper output (processed/*.json + media/photos), read-only for the API.
    - ./data:/data:ro
    # Persisted runtime DB so it survives restarts and isn't rebuilt each boot.
    - dbdata:/db
  # Serve only once the DB has been built (init completed) — so uvicorn starts
  # immediately and the healthcheck passes without waiting on a build.
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s
  # Colors never auto-start on a bare `up`; ./deploy.sh brings the right one up.
  profiles: ["serve"]

services:
  # The stable front (see docker/Caddyfile). Owns the published port and load-
  # balances across the two colors with active health checks + request retries,
  # so the deploy-time color swap drops no requests.
  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      # Behind Cloudflare / a host TLS proxy, bind to localhost: 127.0.0.1:8000:8000
      - "${PARLAMONITOR_PORT:-8000}:8000"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # One-shot builder. Builds the runtime DB on first boot (or REBUILD_DB=1) and
  # exits; the colors + sync wait for it to COMPLETE. This keeps the potentially
  # long first build (HuSpaCy word-cloud lemmatization can take many minutes)
  # out of the serving container, so a color's healthcheck is never held up.
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: parlamonitor:latest
    command: ["ensure-db"]
    environment:
      <<: [*common-env, *nlp-env]
      # Set to 1 to rebuild the DB from /data on the next `up` / deploy.
      REBUILD_DB: ${REBUILD_DB:-0}
    volumes:
      - ./data:/data:ro
      - dbdata:/db
    restart: "no"

  # The two serving colors. ./deploy.sh runs exactly one; both are identical.
  app_blue:
    <<: *app-serve
  app_green:
    <<: *app-serve

  # Tools-only: never auto-starts. The target of one-off commands, e.g.
  #   podman compose run --rm app update      # incremental DB reconcile
  #   podman compose run --rm app loader       # full rebuild
  #   podman compose run --rm app pytest       # test suite
  #   podman compose run --rm app sh           # a shell
  app:
    <<: *app-serve
    depends_on: {}
    restart: "no"
    profiles: ["tools"]

  # Continuous, low-load sync of the latest cycle. Comment this whole service
  # out to disable in-container syncing (e.g. when driving it from an external
  # cron). Restarted by ./deploy.sh onto the new image (harmless — flock-guarded
  # and idle between polls).
  sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: parlamonitor:latest
    command: ["sync-loop"]
    environment:
      <<: [*common-env, *nlp-env, *timing-env]
      # How often to poll parlament.hu (seconds). An idle poll is a handful of
      # requests; a change triggers a scoped re-scrape + incremental DB update.
      PARLAMONITOR_SYNC_INTERVAL: ${PARLAMONITOR_SYNC_INTERVAL:-1800}
      # Optional: pin a cycle instead of auto-detecting the latest.
      PARLAMONITOR_SYNC_CYCLE: ${PARLAMONITOR_SYNC_CYCLE:-}
      # Politeness toward parlament.hu (SCR-4) — all optional.
      PARLAMONITOR_SLEEP: ${PARLAMONITOR_SLEEP:-1.0}
      PARLAMONITOR_USER_AGENT: ${PARLAMONITOR_USER_AGENT:-}
      PARLAMONITOR_PROXY: ${PARLAMONITOR_PROXY:-}
      # Optional SSH tunnel: route all parlament.hu traffic through an SSH host so
      # it egresses from a fixed IP (scraper/ssh_proxy.py). Active once SSH_HOST is
      # set; the private key is bind-mounted read-only below and SSH_KEY is then
      # auto-pointed at that in-container path. Legacy `ssh-rsa` servers are
      # detected and handled automatically (no PubkeyAcceptedTypes knob needed).
      PARLAMONITOR_SSH_HOST: ${PARLAMONITOR_SSH_HOST:-}
      PARLAMONITOR_SSH_PORT: ${PARLAMONITOR_SSH_PORT:-22}
      PARLAMONITOR_SSH_USER: ${PARLAMONITOR_SSH_USER:-}
      # Fixed in-container path of the key bind-mounted below (plain literal, no
      # interpolation — podman-compose mishandles the fancier forms). Harmless
      # when SSH is off: the scraper ignores it unless SSH_HOST is also set.
      PARLAMONITOR_SSH_KEY: /run/secrets/ssh_key
      PARLAMONITOR_SSH_KEY_PASSPHRASE: ${PARLAMONITOR_SSH_KEY_PASSPHRASE:-}
      PARLAMONITOR_SSH_KNOWN_HOSTS: ${PARLAMONITOR_SSH_KNOWN_HOSTS:-}
      # Refresh the per-MP registry at most this often (seconds); 12h default.
      PARLAMONITOR_SYNC_REPS_MAX_AGE: ${PARLAMONITOR_SYNC_REPS_MAX_AGE:-43200}
    volumes:
      # Read-write here: the sync writes fresh scraper output + portraits.
      - ./data:/data
      - dbdata:/db
      # SSH tunnel private key, read-only. Host path comes from .env; when SSH is
      # not configured this defaults to /dev/null so compose stays happy and the
      # (never-read) mount is harmless.
      - ${PARLAMONITOR_SSH_KEY_FILE:-/dev/null}:/run/secrets/ssh_key:ro
    # Start only after the DB has been built (init completed), so sync only ever
    # does cheap incremental updates and never races the first full build.
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
  caddy_config:

# Parlamonitor — Docker / Podman Compose deployment.
#
# One image (OPS-1). Compose runs only the STABLE plumbing here; the two
# interchangeable serving "colors" are managed by ./deploy.sh with plain
# `podman` (so the zero-downtime blue-green swap works the same on old
# podman-compose as on the modern `podman compose`/`docker compose` provider).
# The colors join caddy's compose network at deploy time (./deploy.sh detects it
# off the running caddy container — no external network needed, works on every
# compose version) and mount the same external DB volume that ./deploy.sh owns.
#
#   caddy   — the stable front. Owns the published port and health-check-
#             balances across app_blue / app_green (see docker/Caddyfile).
#             Nothing else binds the port, so the color swap is invisible to
#             whatever is in front (Cloudflare, a host TLS proxy, or nothing).
#   init    — one-shot: builds the runtime DB from /data on first boot (or
#             REBUILD_DB=1), then exits. Keeps the slow first build out of a
#             serving color's healthcheck.
#   sync    — sidecar: continuously checks parlament.hu for changes in the
#             latest cycle, re-scrapes only what changed (SCR-2/SCR-4) and
#             incrementally updates the DB in place, swapping it atomically
#             (DB-4). The colors pick it up on the next request — no restart.
#
# The serving colors themselves are NOT compose services — ./deploy.sh runs
# them. See DEPLOYMENT.md for the full guide.
#
#   ./deploy.sh                       # build + bring up everything, zero-downtime swap
#   ./deploy.sh --status              # which color is serving now
#   podman-compose logs -f sync       # watch the continuous sync
#   podman logs -f parlamonitor_app_blue   # watch the active color
#   open http://localhost:8000        # app + /api/docs (via caddy)

x-common-env: &common-env
  # Paths inside the container (match the volumes below).
  PARLAMONITOR_DB: /db/parlamonitor.db
  PARLAMONITOR_DATA_DIR: /data
  PARLAMONITOR_PHOTOS_DIR: /data/media/photos
  # Empty = all modules (proceedings,representatives,bills,votes). EXT-6.
  PARLAMONITOR_MODULES: ${PARLAMONITOR_MODULES:-}
  # Which electoral cycles the SITE SHOWS (§4A CYC-7). Empty (default) = every
  # cycle in the DB; name them to serve a window instead ("43" / "42,43"): the
  # cycle chooser offers only those, every query is clamped to them, and pages
  # outside them 404 and leave the sitemaps. Serving-time only — the DB keeps
  # every cycle, so widening it needs a restart, not a rebuild. (Not to be
  # confused with PARLAMONITOR_MODAL_CYCLES below, which is a spend guard on the
  # NLP offload, or PARLAMONITOR_SYNC_CYCLE, which is what the scraper fetches.)
  PARLAMONITOR_SITE_CYCLES: ${PARLAMONITOR_SITE_CYCLES:-}

# Word-cloud NLP config shared by the services that build/update the DB (init,
# sync). Set PARLAMONITOR_WORDCLOUD_BACKEND=modal + the Modal token to offload the
# heavy NER/lemmatization to modal.com (WCLOUD-6) — ideal on a small host.
x-nlp-env: &nlp-env
  PARLAMONITOR_WORDCLOUD_BACKEND: ${PARLAMONITOR_WORDCLOUD_BACKEND:-auto}
  # Model for the CURRENT electoral period — must match the model baked into the
  # primary Modal app's image; it is part of the cache/method tag, so changing it
  # re-NERs the affected sittings on the next build.
  PARLAMONITOR_HUSPACY_MODEL: ${PARLAMONITOR_HUSPACY_MODEL:-hu_core_news_trf}
  # Cheaper model for the frozen earlier cycles (their cached results are keyed
  # to it and never recompute); must match the archive Modal app's image.
  PARLAMONITOR_HUSPACY_MODEL_ARCHIVE: ${PARLAMONITOR_HUSPACY_MODEL_ARCHIVE:-hu_core_news_md}
  PARLAMONITOR_MODAL_APP: ${PARLAMONITOR_MODAL_APP:-parlamonitor-nlp}
  PARLAMONITOR_MODAL_APP_ARCHIVE: ${PARLAMONITOR_MODAL_APP_ARCHIVE:-parlamonitor-nlp-md}
  MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
  MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
  # Which electoral cycles may be processed ON MODAL at all — the budget guard.
  # `latest` (default) keeps the metered work on the cycle the site actually
  # shows, so backfilling the archive can't drain the credit the live cycle needs;
  # `all` restores the old behaviour, or name cycles explicitly ("43" / "42,43").
  # Scopes BOTH offloads: the word cloud/NER here and the Whisper transcription
  # below. Out-of-scope sittings degrade locally (regex cloud, no inline entity
  # links, positional sentence timing) and keep whatever is already cached.
  PARLAMONITOR_MODAL_CYCLES: ${PARLAMONITOR_MODAL_CYCLES:-latest}
  # Person-entity linking (NEL, §10): extract PERSON mentions (same HuSpaCy
  # backend as the word cloud — set _WORDCLOUD_BACKEND=modal to offload) and
  # resolve each name to Wikidata/Wikipedia. Set to 0 to disable.
  PARLAMONITOR_ENTITY_LINKS: ${PARLAMONITOR_ENTITY_LINKS:-1}
  # CAP policy topics (§5.8). Classification is XLM-R-large, which this host has
  # no business running — `modal` sends the sittings `sync` loads to the deployed
  # parlacap_modal_app.py (scoped by PARLAMONITOR_MODAL_CYCLES above, so only the
  # newest cycle is ever metered; the archive is classified once on a GPU box and
  # its parlacap-cache.json copied into the db volume — see DEPLOYMENT.md).
  # Defaults to `modal` because on THIS host nothing else can work — `auto` never
  # auto-selects Modal (spending credit is always explicit) and would leave new
  # sittings unlabelled here. Without MODAL_TOKEN_* it warns once per update and
  # degrades to leaving them unlabelled, which is the same outcome, logged. `off`
  # stops classifying without hiding the labels the DB already carries.
  PARLAMONITOR_PARLACAP_BACKEND: ${PARLAMONITOR_PARLACAP_BACKEND:-modal}
  PARLAMONITOR_PARLACAP_MODAL_APP: ${PARLAMONITOR_PARLACAP_MODAL_APP:-parlamonitor-parlacap}
  # The confidence a paragraph must reach to count toward its speech's topic.
  # Applied when a request is SERVED, so retuning it needs only a restart of the
  # serving colors — never a reclassification and never a rebuild.
  PARLAMONITOR_PARLACAP_THRESHOLD: ${PARLAMONITOR_PARLACAP_THRESHOLD:-0.90}
  # Also label the irományok themselves, from the text of the document each one
  # links to (TOPIC-8). On this host that is a cache replay by default: the
  # server mirrors no documents (PARLAMONITOR_DOCUMENTS is off, DOC-1), so the
  # rows come from the same parlacap-cache.json shipped for the speech topics,
  # and an iromány submitted since that cache was built carries no label. Set
  # PARLAMONITOR_DOCUMENTS=text (see the sync service below) to give this host
  # the text instead, and new irományok get classified here as they arrive. With
  # neither the pass writes nothing and the chip hides itself — never an error.
  PARLAMONITOR_BILL_TOPICS: ${PARLAMONITOR_BILL_TOPICS:-1}

# Whisper forced-alignment sentence-timing config for the scraping side (sync).
# PARLAMONITOR_TIMING_BACKEND=auto uses Whisper on Modal when the MODAL_TOKEN_* above
# is set (deploy scraper/whisper_modal_app.py first), else degrades to the positional
# estimate (TIM-1/TIM-5). Reuses the same Modal token as the word-cloud offload; only
# the deployed app name differs — and the same PARLAMONITOR_MODAL_CYCLES scope, so a
# backfill of an old cycle is timed positionally instead of on a GPU.
x-timing-env: &timing-env
  PARLAMONITOR_TIMING_BACKEND: ${PARLAMONITOR_TIMING_BACKEND:-auto}
  PARLAMONITOR_WHISPER_MODAL_APP: ${PARLAMONITOR_WHISPER_MODAL_APP:-parlamonitor-whisper}

# Bluesky announcements (§8.7). The sync pass posts when a sitting day becomes
# FULLY processed (every speech has its transcript and its video window — the same
# state the site stops badging "Részben feldolgozva") and when a representative
# accidentally spoke a haiku. Entirely off until _BLUESKY_AUTH is set: that one
# variable is both the credential and the switch.
#
#   .env
#   PARLAMONITOR_BLUESKY_AUTH=parlamonitor.bsky.social:abcd-efgh-ijkl-mnop
#
# Use an APP password (bsky.app → Settings → Privacy and security → App passwords),
# never the account password. A first run posts nothing: it records the recent days
# as already-announced, so a fresh deploy or a wiped volume cannot dump a backlog
# into the feed. Try it out first with:
#   podman-compose run --rm init announce --dry-run
x-bluesky-env: &bluesky-env
  PARLAMONITOR_BLUESKY_AUTH: ${PARLAMONITOR_BLUESKY_AUTH:-}
  # Posts link to the site, so the bot needs the canonical public origin. Shares
  # PARLAMONITOR_SITE_URL with the OG share cards; nothing is posted without it.
  PARLAMONITOR_SITE_URL: ${PARLAMONITOR_SITE_URL:-}
  # Keep the account configured but stop posting (embargo/debugging), or decide and
  # log the posts without sending them.
  PARLAMONITOR_BLUESKY_ANNOUNCE: ${PARLAMONITOR_BLUESKY_ANNOUNCE:-1}
  PARLAMONITOR_BLUESKY_DRY_RUN: ${PARLAMONITOR_BLUESKY_DRY_RUN:-0}
  # Haiku posts (SOC-4) and their per-sitting-day quota.
  PARLAMONITOR_BLUESKY_HAIKUS: ${PARLAMONITOR_BLUESKY_HAIKUS:-1}
  PARLAMONITOR_BLUESKY_HAIKU_PER_DAY: ${PARLAMONITOR_BLUESKY_HAIKU_PER_DAY:-1}
  # Flood guards: how far back a day may be to still count as news, and the hard
  # cap on posts per pass (the rest waits for the next one).
  PARLAMONITOR_BLUESKY_MAX_AGE_DAYS: ${PARLAMONITOR_BLUESKY_MAX_AGE_DAYS:-30}
  PARLAMONITOR_BLUESKY_MAX_POSTS: ${PARLAMONITOR_BLUESKY_MAX_POSTS:-4}
  # The bot's memory of what it has already said. Defaults to `bluesky-state.json`
  # beside the DB — i.e. on the /db volume, so it survives restarts AND a
  # REBUILD_DB, which is the point: the content DB is regenerable, so remembering
  # this inside it would re-announce the whole corpus after a rebuild.
  PARLAMONITOR_BLUESKY_STATE: ${PARLAMONITOR_BLUESKY_STATE:-}

services:
  # The stable front (see docker/Caddyfile). Owns the published port and load-
  # balances across the two colors with active health checks + request retries,
  # so the deploy-time color swap drops no requests. It reaches the colors by
  # their network aliases (app_blue / app_green) on the shared external network.
  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      # Behind Cloudflare / a host TLS proxy, bind to localhost: 127.0.0.1:8000:8000
      - "${PARLAMONITOR_PORT:-8000}:8000"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # One-shot builder. ./deploy.sh runs this (`compose run --rm init`) before it
  # starts a color, so the potentially long first build (HuSpaCy word-cloud
  # lemmatization can take many minutes) never blocks a serving healthcheck.
  # Also the target of one-off DB commands, e.g.
  #   podman-compose run --rm init update     # incremental DB reconcile
  #   podman-compose run --rm init loader      # full rebuild
  #   podman-compose run --rm init pytest      # test suite
  #   podman-compose run --rm init sh          # a shell
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: parlamonitor:latest
    command: ["ensure-db"]
    environment:
      # *bluesky-env so `compose run --rm init announce [--dry-run]` works here too;
      # `ensure-db` itself never posts (only the sync pass and that verb do).
      <<: [*common-env, *nlp-env, *bluesky-env]
      # Set to 1 to rebuild the DB from /data on the next run.
      REBUILD_DB: ${REBUILD_DB:-0}
    volumes:
      - ./data:/data:ro
      - dbdata:/db
    restart: "no"

  # Continuous, low-load sync of the latest cycle. Comment this whole service
  # out to disable in-container syncing (e.g. when driving it from an external
  # cron). ./deploy.sh refreshes it onto the new image after each deploy
  # (harmless — flock-guarded and idle between polls).
  sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: parlamonitor:latest
    command: ["sync-loop"]
    environment:
      <<: [*common-env, *nlp-env, *timing-env, *bluesky-env]
      # How often to poll parlament.hu (seconds). An idle poll is a handful of
      # requests; a change triggers a scoped re-scrape + incremental DB update.
      PARLAMONITOR_SYNC_INTERVAL: ${PARLAMONITOR_SYNC_INTERVAL:-1800}
      # Optional: pin a cycle instead of auto-detecting the latest.
      PARLAMONITOR_SYNC_CYCLE: ${PARLAMONITOR_SYNC_CYCLE:-}
      # Politeness toward parlament.hu (SCR-4) — all optional.
      PARLAMONITOR_SLEEP: ${PARLAMONITOR_SLEEP:-1.0}
      # Rate-limited (CAPTCHA page instead of data): retry every 10 minutes, and
      # give the pass up after this many fruitless stand-offs (9 ≈ 1.5h).
      PARLAMONITOR_CAPTCHA_RETRIES: ${PARLAMONITOR_CAPTCHA_RETRIES:-9}
      PARLAMONITOR_USER_AGENT: ${PARLAMONITOR_USER_AGENT:-}
      PARLAMONITOR_PROXY: ${PARLAMONITOR_PROXY:-}
      # Optional SSH tunnel: route all parlament.hu traffic through an SSH host so
      # it egresses from a fixed IP (scraper/ssh_proxy.py). Active once SSH_HOST is
      # set; the private key is bind-mounted read-only below and SSH_KEY is then
      # auto-pointed at that in-container path. Legacy `ssh-rsa` servers are
      # detected and handled automatically (no PubkeyAcceptedTypes knob needed).
      PARLAMONITOR_SSH_HOST: ${PARLAMONITOR_SSH_HOST:-}
      PARLAMONITOR_SSH_PORT: ${PARLAMONITOR_SSH_PORT:-22}
      PARLAMONITOR_SSH_USER: ${PARLAMONITOR_SSH_USER:-}
      # Fixed in-container path of the key bind-mounted below (plain literal, no
      # interpolation — podman-compose mishandles the fancier forms). Harmless
      # when SSH is off: the scraper ignores it unless SSH_HOST is also set.
      PARLAMONITOR_SSH_KEY: /run/secrets/ssh_key
      PARLAMONITOR_SSH_KEY_PASSPHRASE: ${PARLAMONITOR_SSH_KEY_PASSPHRASE:-}
      PARLAMONITOR_SSH_KNOWN_HOSTS: ${PARLAMONITOR_SSH_KNOWN_HOSTS:-}
      # Refresh the per-MP registry at most this often (seconds); 12h default.
      PARLAMONITOR_SYNC_REPS_MAX_AGE: ${PARLAMONITOR_SYNC_REPS_MAX_AGE:-43200}
      # Mirror of the iromány document files (DOC-1). `off` — the default — is
      # what keeps the server's disk as it is: `pdf`/`all` is ~870 MB per cycle,
      # and the site links documents on parlament.hu rather than serving copies.
      # `text` (~4 MB per cycle) additionally needs poppler-utils, which the
      # image carries.
      #
      # It is also the ONLY thing this host can do to give a *newly submitted*
      # iromány a topic chip of its own: with no mirror, the iromány half of the
      # CAP pass has no text to read and can only replay parlacap-cache.json
      # (see PARLAMONITOR_BILL_TOPICS above), so anything submitted after the
      # cache was last shipped stays unlabelled. Setting
      #   PARLAMONITOR_DOCUMENTS=text
      # in .env closes that loop — the sync mirrors the text and the reconcile
      # behind it classifies the new irományok on Modal, with no hand-shipped
      # cache in the middle. Note it downloads every PDF to keep the text, so
      # the first passes are the whole cycle's backlog, not just what is new:
      PARLAMONITOR_DOCUMENTS: ${PARLAMONITOR_DOCUMENTS:-off}
      PARLAMONITOR_DOCUMENTS_COMPRESSION: ${PARLAMONITOR_DOCUMENTS_COMPRESSION:-xz}
      PARLAMONITOR_DOCUMENTS_MAX_MB: ${PARLAMONITOR_DOCUMENTS_MAX_MB:-0}
      # …which is what this paces. A pass fetches at most this many NEW documents
      # and leaves the rest to the next one, so a freshly enabled mirror drains
      # its backlog over a day of polls instead of holding one pass (and the sync
      # lock, and the DB reconcile behind it) for a ~15-minute download run.
      # 0 = no cap. Inert while PARLAMONITOR_DOCUMENTS=off.
      PARLAMONITOR_DOCUMENTS_PER_SYNC: ${PARLAMONITOR_DOCUMENTS_PER_SYNC:-25}
    volumes:
      # Read-write here: the sync writes fresh scraper output + portraits.
      - ./data:/data
      - dbdata:/db
      # SSH tunnel private key, read-only. Host path comes from .env; when SSH is
      # not configured this defaults to /dev/null so compose stays happy and the
      # (never-read) mount is harmless.
      - ${PARLAMONITOR_SSH_KEY_FILE:-/dev/null}:/run/secrets/ssh_key:ro
    # A hint for the modern compose provider; ./deploy.sh also orders init before
    # sync explicitly, so this works even where the condition is not honored.
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

# Search analytics (PRIV-1): the serving colors log aggregated, GDPR-friendly
# search-keyword stats (no IP, no exact timestamp) to a SEPARATE SQLite file, and
# export them daily to per-day CSV files (./analytics/csv/search-analytics-*.csv)
# so they can be read off the host without sqlite3. Like the colors themselves,
# that store is owned by ./deploy.sh, which bind-mounts a HOST directory
# (./analytics) to /analytics so both are readable from outside the container.
# Nothing in this compose file needs it — init/sync don't serve /search — so it
# is intentionally not mounted here.
#
# The DB volume is EXTERNAL and owned by ./deploy.sh (it creates it if missing).
# External guarantees the compose plumbing and the hand-run colors mount the
# exact same volume by name on every compose version — no project-prefix
# surprises. The network is compose's own default; ./deploy.sh detects it off the
# caddy container and joins the colors to it. Run `./deploy.sh` first (it creates
# the volume), after which plain `podman-compose` commands work too.
volumes:
  dbdata:
    name: parlamonitor_dbdata
    external: true
  caddy_data:
  caddy_config:
